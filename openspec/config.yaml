schema: spec-driven

context: |
  Language: vi
  All artifacts must be written in vi.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: AI Web Testing Hybrid Architecture (Google Chrome DevTools MCP + Spec-Driven Python Excel Reporter).
  Tech stack:
  - Browser Automation & Deep Debugging: ChromeDevTools/chrome-devtools-mcp (Node.js v18+, Google Chrome, zero external API cost, Chat Gate for manual login).
  - Reporting Engine: Python 3 (openpyxl, pyyaml, pillow, pytest) generating a 3-sheet enterprise Excel report (Summary, TestResults with 11 columns & relative hyperlinks, NoteBug with embedded 200x112px screenshot thumbnails, 125pt row height, and F12 Console/Network Root Cause).
  - Version Control: Commit and push to GitHub after every completed step.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
