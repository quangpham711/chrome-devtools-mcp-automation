suite_name: "Kiểm thử Hệ thống MiDesk CRM (Pizza 4P's UAT)"
target_url: "https://pizza4ps-uat.midesk.vn/vi"
requires_chat_gate_login: true

test_cases:
  - id: "COMP_TC_01"
    module: "Authentication"
    feature: "Đăng nhập qua Chat Gate bảo mật"
    description: "Kiểm tra quy trình đăng nhập thủ công qua Chat Gate và chuyển hướng vào trang tổng quan"
    steps:
      - "Agent mở URL trang đăng nhập bằng navigate_page trên cửa sổ Google Chrome (Headed mode)"
      - "Người dùng tự nhập tài khoản mật khẩu an toàn trên Chrome"
      - "Agent tự động quan sát (wait_for) và kích hoạt chạy tiếp ngay khi nhận diện đăng nhập thành công vào Dashboard"
    expected_result: "Đăng nhập thành công vào trang Dashboard, không lưu mật khẩu, không có lỗi Console F12 hay API 500"

  - id: "COMP_TC_02"
    module: "Dashboard"
    feature: "Thống kê số liệu tổng quan"
    description: "Kiểm tra các thẻ chỉ số KPI và biểu đồ trên trang chủ tải đúng dữ liệu từ API"
    steps:
      - "Quan sát khu vực thẻ thống kê KPI tại màn hình chính"
      - "Kiểm tra các request lấy dữ liệu thống kê qua list_network_requests"
      - "Kiểm tra lỗi Javascript qua list_console_messages"
    expected_result: "Tất cả API thống kê trả về HTTP 200, số liệu hiển thị rõ ràng và không bị treo loading"

  - id: "COMP_TC_03"
    module: "Customer Management"
    feature: "Tìm kiếm và lọc danh sách khách hàng"
    description: "Kiểm tra chức năng tìm kiếm từ khóa và bộ lọc trạng thái khách hàng"
    steps:
      - "Điều hướng vào menu Quản lý Khách hàng"
      - "Dùng công cụ fill nhập từ khóa tìm kiếm vào ô Search và nhấn Enter"
      - "Chờ kết quả hiển thị bằng wait_for và kiểm tra danh sách trả về"
    expected_result: "Bảng dữ liệu hiển thị đúng danh sách khách hàng khớp từ khóa tìm kiếm, tốc độ phản hồi nhanh"

  - id: "COMP_TC_04"
    module: "Ticket / Order"
    feature: "Tạo mới phiếu yêu cầu / đơn hàng"
    description: "Kiểm tra luồng mở popup tạo mới, điền thông tin bắt buộc và bấm nút Lưu"
    steps:
      - "Click vào nút Tạo mới trên góc phải màn hình"
      - "Điền thông tin vào các trường bắt buộc bằng công cụ fill / fill_form"
      - "Click nút Lưu và kiểm tra kết quả trả về từ API backend"
    expected_result: "Tạo mới thành công, hiển thị thông báo thành công và bản ghi mới xuất hiện đầu danh sách"

  - id: "COMP_TC_05"
    module: "Ticket Validation"
    feature: "Kiểm tra ràng buộc trường bắt buộc khi Tạo Phiếu"
    description: "Kiểm tra hành vi chặn submit khi bấm Lưu: New mà bỏ trống Người yêu cầu, Tiêu đề, Nội dung"
    steps:
      - "Tại màn hình Tạo mới Phiếu (ticket/indexTicket), giữ trống các trường bắt buộc (*)"
      - "Click vào nút Lưu: New bằng công cụ click của Chrome DevTools MCP"
      - "Kiểm tra trạng thái focus trên giao diện và kiểm tra F12 Console / Network"
    expected_result: "Hệ thống chặn gửi form rỗng, tự động focus vào trường bắt buộc Người yêu cầu (*), không phát sinh lỗi Console hay HTTP 500"

  - id: "COMP_TC_06"
    module: "Order Management"
    feature: "Điều hướng và tải danh sách Đơn hàng"
    description: "Kiểm tra chức năng mở phân hệ Đơn hàng (order/indexOrder) trên thanh menu trái"
    steps:
      - "Click vào biểu tượng Đơn hàng trên thanh điều hướng bên trái"
      - "Chờ Iframe order/indexOrder và bảng order_main_list tải dữ liệu"
      - "Kiểm tra các request API qua list_network_requests và lỗi Console qua list_console_messages"
    expected_result: "Trang Đơn hàng tải thành công, các API order_main_list và get_order_main_list trả về HTTP 200, không có lỗi Console"

  - id: "COMP_TC_07"
    module: "Event Management"
    feature: "Điều hướng phân hệ Sự kiện & Kiểm tra lỗi F12 Console"
    description: "Kiểm tra phân hệ Sự kiện (event/indexEvent) và rà soát lỗi Javascript Console F12 / Network API"
    steps:
      - "Click vào biểu tượng Sự kiện trên thanh điều hướng bên trái"
      - "Quan sát giao diện Lịch sự kiện và bộ lọc thời gian trong Iframe event/indexEvent"
      - "Gọi list_console_messages và list_network_requests để kiểm tra lỗi kỹ thuật F12"
    expected_result: "Trang Sự kiện hiển thị đầy đủ lịch và bộ lọc, hoàn toàn không có lỗi Javascript đỏ (SyntaxError/TypeError) trên Console F12"


